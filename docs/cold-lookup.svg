<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1702" width="1000" height="1702" role="img" aria-label="DNSResolver, one cold lookup end to end, as a 25-step sequence across the caller goroutine, QueryLookup, the record cache, the comm managers and three mock servers from dnscache_test.go (root, br TLD, authoritative). Before the lookup, initRoot plants the root NS a.root-servers.net at 198.41.0.4. TestBasic calls QueryLookup for www.mvirtualnet.com.br. Hop 1, depth 0: the cache misses, bestNS falls back to the root, getServerComm misses and makes a new manager through commConnect because managers are never stored, and QueryLookup sends the request on manager.requests and waits up to 3 seconds; a timeout would leave the message nil and panic. The root refers to six br nameservers with glue; each record is cached alone for a year, so only f.dns.br survives as the br NS. Hop 2, depth 1: it asks f.dns.br at 200.219.159.10, which refers to mvirtualnet.com.br (ns1 and ns2, glue 191.241.52.28 and .29); only ns2 is kept. Hop 3, depth 2: it asks ns2 at 191.241.52.29, which answers A 191.241.53.61; the answer is cached for a year and returned to the caller as a DNSAnswer with class IN.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1702" rx="12"/>
  <text class="title" x="32" y="48">DNSResolver — one cold lookup, end to end</text>
  <text class="sub" x="32" y="74">TestBasic resolves name = "www.mvirtualnet.com.br" from a cold cache: 3 round trips, depths 0–2 of max 3.</text>
  <!-- legend -->
  <rect class="b-gray" x="32" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="50" y="98">caller</text>
  <rect class="b-blue" x="101" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="119" y="98">resolver step</text>
  <rect class="b-green" x="209" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="227" y="98">record cache</text>
  <rect class="b-purple" x="318" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="336" y="98">network side (comm managers, mock servers)</text>
  <rect class="b-orange" x="600" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="618" y="98">note</text>
  <rect class="b-red" x="663" y="88" width="12" height="12" rx="3"/>
  <text class="elbl" x="681" y="98">crash path, not taken here</text>
  <line class="edge" x1="32" y1="114" x2="62" y2="114" marker-end="url(#ah)"/>
  <text class="elbl" x="70" y="118">call or send</text>
  <line class="edge-dash" x1="150" y1="114" x2="180" y2="114" marker-end="url(#ah)"/>
  <text class="elbl" x="188" y="118">reply</text>
  <circle class="b-blue" cx="242" cy="114" r="7"/>
  <text class="elbl" x="256" y="118">step number, on the sender’s lifeline</text>
  <!-- hop bands -->
  <rect class="group" x="12" y="338" width="976" height="554" rx="8"/>
  <rect class="group" x="12" y="904" width="976" height="414" rx="8"/>
  <rect class="group" x="12" y="1330" width="976" height="302" rx="8"/>
  <!-- lifelines -->
  <line class="group" x1="50" y1="196" x2="50" y2="1686"/>
  <line class="group" x1="208" y1="196" x2="208" y2="1686"/>
  <line class="group" x1="494" y1="196" x2="494" y2="1686"/>
  <line class="group" x1="630" y1="196" x2="630" y2="1686"/>
  <line class="group" x1="738" y1="196" x2="738" y2="1686"/>
  <line class="group" x1="824" y1="196" x2="824" y2="1686"/>
  <line class="group" x1="930" y1="196" x2="930" y2="1686"/>
  <!-- participants -->
  <rect class="group" x="700" y="126" width="292" height="80" rx="10"/>
  <text class="glbl" x="712" y="142">mock internet · dnscache_test.go</text>
  <rect class="b-gray" x="12" y="150" width="76" height="46" rx="10"/>
  <text class="lbl" x="50" y="170" text-anchor="middle">caller</text>
  <text class="note" x="50" y="187" text-anchor="middle">goroutine</text>
  <rect class="b-blue" x="150" y="150" width="116" height="46" rx="10"/>
  <text class="lbl" x="208" y="170" text-anchor="middle">QueryLookup</text>
  <text class="note" x="208" y="187" text-anchor="middle">dnscache.go</text>
  <rect class="b-green" x="438" y="150" width="112" height="46" rx="10"/>
  <text class="lbl" x="494" y="170" text-anchor="middle">record cache</text>
  <text class="note" x="494" y="187" text-anchor="middle">dnsCache</text>
  <rect class="b-purple" x="564" y="150" width="132" height="46" rx="10"/>
  <text class="lbl" x="630" y="170" text-anchor="middle">comm managers</text>
  <text class="note" x="630" y="187" text-anchor="middle">serverCommCache</text>
  <rect class="b-purple" x="708" y="150" width="60" height="46" rx="10"/>
  <text class="lbl" x="738" y="178" text-anchor="middle">root</text>
  <rect class="b-purple" x="788" y="150" width="72" height="46" rx="10"/>
  <text class="lbl" x="824" y="178" text-anchor="middle">br TLD</text>
  <rect class="b-purple" x="876" y="150" width="108" height="46" rx="10"/>
  <text class="lbl" x="930" y="178" text-anchor="middle">authoritative</text>
  <!-- steps, top to bottom -->
  <rect class="b-orange" x="364" y="210" width="260" height="80" rx="8"/>
  <text class="note" x="374" y="229">before the lookup, InitCache → initRoot</text>
  <text class="note" x="374" y="245">plants "." NS a.root-servers.net and</text>
  <text class="note" x="374" y="261">a.root-servers.net A 198.41.0.4, both</text>
  <text class="note" x="374" y="277">expiring now + 1 year</text>
  <!-- step 1 -->
  <line class="edge" x1="62" y1="318" x2="207" y2="318" marker-end="url(#ah)"/>
  <circle class="b-gray" cx="50" cy="318" r="12"/>
  <text class="lbl" x="50" y="323" text-anchor="middle">1</text>
  <text class="note" x="135" y="310" text-anchor="middle">QueryLookup(name, A)</text>
  <rect class="b-gray" x="12" y="338" width="392" height="24" rx="8"/>
  <text class="glbl" x="24" y="354">hop 1 · depth 0 · root a.root-servers.net (198.41.0.4)</text>
  <!-- step 2 -->
  <line class="edge" x1="220" y1="386" x2="493" y2="386" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="386" r="12"/>
  <text class="lbl" x="208" y="391" text-anchor="middle">2</text>
  <text class="note" x="224" y="378">cacheLookup(name, A) → nil (miss)</text>
  <!-- step 3 -->
  <line class="edge" x1="220" y1="452" x2="493" y2="452" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="452" r="12"/>
  <text class="lbl" x="208" y="457" text-anchor="middle">3</text>
  <text class="note" x="224" y="412">bestNS(name): no NS cached for the name,</text>
  <text class="note" x="224" y="428">mvirtualnet.com.br, com.br or br, so</text>
  <text class="note" x="224" y="444">→ "." NS a.root-servers.net (bootstrapped)</text>
  <!-- step 4 -->
  <line class="edge" x1="220" y1="502" x2="493" y2="502" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="502" r="12"/>
  <text class="lbl" x="208" y="507" text-anchor="middle">4</text>
  <text class="note" x="224" y="478">cacheLookup("a.root-servers.net", A)</text>
  <text class="note" x="224" y="494">→ 198.41.0.4 (bootstrapped)</text>
  <!-- step 5 -->
  <line class="edge" x1="220" y1="568" x2="629" y2="568" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="568" r="12"/>
  <text class="lbl" x="208" y="573" text-anchor="middle">5</text>
  <text class="note" x="224" y="528">getServerComm(198.41.0.4) — a miss:</text>
  <text class="note" x="224" y="544">managers are never stored, so every</text>
  <text class="note" x="224" y="560">call makes a new one via commConnect</text>
  <!-- step 6 -->
  <line class="edge" x1="220" y1="618" x2="737" y2="618" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="618" r="12"/>
  <text class="lbl" x="208" y="623" text-anchor="middle">6</text>
  <text class="note" x="224" y="594">serverDNSRequest{name, A, response}</text>
  <text class="note" x="224" y="610">sent on manager.requests</text>
  <rect class="b-red" x="222" y="636" width="264" height="64" rx="8"/>
  <text class="note" x="232" y="655">waits in select: req.response or 3 s timer;</text>
  <text class="note" x="232" y="671">on timeout msg stays nil, and the next</text>
  <text class="note" x="232" y="687">statement panics on range msg.Answers</text>
  <!-- step 7 -->
  <line class="edge-dash" x1="726" y1="760" x2="209" y2="760" marker-end="url(#ah)"/>
  <circle class="b-purple" cx="738" cy="760" r="12"/>
  <text class="lbl" x="738" y="765" text-anchor="middle">7</text>
  <text class="note" x="224" y="720">referral on req.response, Answers empty</text>
  <text class="note" x="224" y="736">Authorities: 6 × NS br (a.dns.br … f.dns.br)</text>
  <text class="note" x="224" y="752">Additionals: 6 glue A records</text>
  <!-- step 8 -->
  <line class="edge" x1="220" y1="826" x2="493" y2="826" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="826" r="12"/>
  <text class="lbl" x="208" y="831" text-anchor="middle">8</text>
  <text class="note" x="224" y="786">cacheSet each record alone, now + 1 year:</text>
  <text class="note" x="224" y="802">6 × NS br overwrite, only f.dns.br is kept;</text>
  <text class="note" x="224" y="818">the 6 glue A records all stay</text>
  <!-- step 9 -->
  <path class="edge" d="M220,852 H238 Q246,852 246,860 V864 Q246,872 238,872 H210" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="852" r="12"/>
  <text class="lbl" x="208" y="857" text-anchor="middle">9</text>
  <text class="note" x="256" y="867">Answers empty → recurse, depth 1</text>
  <rect class="b-gray" x="12" y="904" width="352" height="24" rx="8"/>
  <text class="glbl" x="24" y="920">hop 2 · depth 1 · br TLD f.dns.br (200.219.159.10)</text>
  <!-- step 10 -->
  <line class="edge" x1="220" y1="952" x2="493" y2="952" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="952" r="12"/>
  <text class="lbl" x="208" y="957" text-anchor="middle">10</text>
  <text class="note" x="224" y="944">cacheLookup(name, A) → nil (miss)</text>
  <!-- step 11 -->
  <line class="edge" x1="220" y1="1002" x2="493" y2="1002" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1002" r="12"/>
  <text class="lbl" x="208" y="1007" text-anchor="middle">11</text>
  <text class="note" x="224" y="978">bestNS(name) → "br":</text>
  <text class="note" x="224" y="994">NS f.dns.br, cached in step 8</text>
  <!-- step 12 -->
  <line class="edge" x1="220" y1="1052" x2="493" y2="1052" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1052" r="12"/>
  <text class="lbl" x="208" y="1057" text-anchor="middle">12</text>
  <text class="note" x="224" y="1028">cacheLookup("f.dns.br", A)</text>
  <text class="note" x="224" y="1044">→ 200.219.159.10, glue from step 8</text>
  <!-- step 13 -->
  <line class="edge" x1="220" y1="1086" x2="629" y2="1086" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1086" r="12"/>
  <text class="lbl" x="208" y="1091" text-anchor="middle">13</text>
  <text class="note" x="224" y="1078">getServerComm(200.219.159.10)</text>
  <!-- step 14 -->
  <line class="edge" x1="220" y1="1120" x2="823" y2="1120" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1120" r="12"/>
  <text class="lbl" x="208" y="1125" text-anchor="middle">14</text>
  <text class="note" x="224" y="1112">serverDNSRequest{name, A, response}</text>
  <!-- step 15 -->
  <line class="edge-dash" x1="812" y1="1202" x2="209" y2="1202" marker-end="url(#ah)"/>
  <circle class="b-purple" cx="824" cy="1202" r="12"/>
  <text class="lbl" x="824" y="1207" text-anchor="middle">15</text>
  <text class="note" x="224" y="1146">deeper referral, Answers empty</text>
  <text class="note" x="224" y="1162">Authorities: 2 × NS mvirtualnet.com.br</text>
  <text class="note" x="224" y="1178">(ns1 and ns2.mvirtualnet.com.br)</text>
  <text class="note" x="224" y="1194">Additionals: glue 191.241.52.28, .29</text>
  <!-- step 16 -->
  <line class="edge" x1="220" y1="1252" x2="493" y2="1252" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1252" r="12"/>
  <text class="lbl" x="208" y="1257" text-anchor="middle">16</text>
  <text class="note" x="224" y="1228">cacheSet each record alone, now + 1 year:</text>
  <text class="note" x="224" y="1244">NS mvirtualnet.com.br keeps only ns2</text>
  <!-- step 17 -->
  <path class="edge" d="M220,1278 H238 Q246,1278 246,1286 V1290 Q246,1298 238,1298 H210" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1278" r="12"/>
  <text class="lbl" x="208" y="1283" text-anchor="middle">17</text>
  <text class="note" x="256" y="1293">Answers empty → recurse, depth 2</text>
  <rect class="b-gray" x="12" y="1330" width="492" height="24" rx="8"/>
  <text class="glbl" x="24" y="1346">hop 3 · depth 2 · authoritative ns2.mvirtualnet.com.br (191.241.52.29)</text>
  <!-- step 18 -->
  <line class="edge" x1="220" y1="1378" x2="493" y2="1378" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1378" r="12"/>
  <text class="lbl" x="208" y="1383" text-anchor="middle">18</text>
  <text class="note" x="224" y="1370">cacheLookup(name, A) → nil (miss)</text>
  <!-- step 19 -->
  <line class="edge" x1="220" y1="1428" x2="493" y2="1428" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1428" r="12"/>
  <text class="lbl" x="208" y="1433" text-anchor="middle">19</text>
  <text class="note" x="224" y="1404">bestNS(name) → "mvirtualnet.com.br":</text>
  <text class="note" x="224" y="1420">NS ns2.mvirtualnet.com.br, from step 16</text>
  <!-- step 20 -->
  <line class="edge" x1="220" y1="1478" x2="493" y2="1478" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1478" r="12"/>
  <text class="lbl" x="208" y="1483" text-anchor="middle">20</text>
  <text class="note" x="224" y="1454">cacheLookup("ns2.mvirtualnet.com.br", A)</text>
  <text class="note" x="224" y="1470">→ 191.241.52.29, glue from step 16</text>
  <!-- step 21 -->
  <line class="edge" x1="220" y1="1512" x2="629" y2="1512" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1512" r="12"/>
  <text class="lbl" x="208" y="1517" text-anchor="middle">21</text>
  <text class="note" x="224" y="1504">getServerComm(191.241.52.29)</text>
  <!-- step 22 -->
  <line class="edge" x1="220" y1="1546" x2="929" y2="1546" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1546" r="12"/>
  <text class="lbl" x="208" y="1551" text-anchor="middle">22</text>
  <text class="note" x="224" y="1538">serverDNSRequest{name, A, response}</text>
  <!-- step 23 -->
  <line class="edge-dash" x1="918" y1="1580" x2="209" y2="1580" marker-end="url(#ah)"/>
  <circle class="b-purple" cx="930" cy="1580" r="12"/>
  <text class="lbl" x="930" y="1585" text-anchor="middle">23</text>
  <text class="note" x="224" y="1572">answer: A 191.241.53.61</text>
  <!-- step 24 -->
  <line class="edge" x1="220" y1="1614" x2="493" y2="1614" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1614" r="12"/>
  <text class="lbl" x="208" y="1619" text-anchor="middle">24</text>
  <text class="note" x="224" y="1606">cacheSet the answer, now + 1 year</text>
  <!-- step 25 -->
  <line class="edge-dash" x1="196" y1="1674" x2="51" y2="1674" marker-end="url(#ah)"/>
  <circle class="b-blue" cx="208" cy="1674" r="12"/>
  <text class="lbl" x="208" y="1679" text-anchor="middle">25</text>
  <text class="note" x="135" y="1650" text-anchor="middle">[]*DNSAnswer{…}</text>
  <text class="note" x="135" y="1666" text-anchor="middle">A 191.241.53.61, IN</text>
</svg>
