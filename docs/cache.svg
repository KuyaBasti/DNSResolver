<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" role="img" aria-label="DNSResolver record cache. A query name such as www.Example.COM. goes through cleanName, which lowercases it and drops the trailing dot, giving the key www.example.com; the root name '.' stays '.'. The key is hashed with 32-bit FNV-1a and taken modulo n to pick slot i of dnsCache, a slice of n pointers to dnsCacheUnit. Each unit is one shard: one sync.RWMutex, read-locked by cacheLookup and write-locked by cacheSet, guarding a two-level map, entries, of type map[string]map[RTYPE]*dnsCacheEntry, whose levels cacheSet creates lazily. entries[name][RTYPE] points to a dnsCacheEntry holding expires time.Time and data []RDATA. cacheSet replaces any old entry with a new one; an expired entry makes cacheLookup return nil and is never deleted. n is 1024 in main.go and 1, 32 and 1024 in the tests. The hash seed is a nil slice, so no salt is mixed in and shard placement is the same every run.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="548" rx="12"/>
  <text class="title" x="32" y="48">DNSResolver — two-level maps behind sharded locks</text>
  <text class="sub" x="32" y="74">A name is cleaned, hashed to one of n shards, then read or written under that shard's lock as entries[name][type].</text>

  <!-- ===== name -> key ===== -->
  <rect class="b-orange" x="32" y="112" width="172" height="76" rx="10"/>
  <text class="lbl" x="118" y="139" text-anchor="middle">query name</text>
  <text class="note mono" x="118" y="159" text-anchor="middle">www.Example.COM.</text>
  <text class="note" x="118" y="176" text-anchor="middle">any case, may end in <tspan class="mono">"."</tspan></text>

  <line class="edge" x1="118" y1="188" x2="118" y2="244" marker-end="url(#ah)"/>
  <text class="elbl mono" x="128" y="220">cleanName</text>

  <rect class="b-orange" x="32" y="246" width="172" height="76" rx="10"/>
  <text class="lbl" x="118" y="273" text-anchor="middle">cache key</text>
  <text class="note mono" x="118" y="293" text-anchor="middle">www.example.com</text>
  <text class="note" x="118" y="310" text-anchor="middle">lowercase, no trailing dot</text>
  <text class="note" x="118" y="344" text-anchor="middle">the root <tspan class="mono">"."</tspan> stays <tspan class="mono">"."</tspan></text>

  <!-- key -> shard index -->
  <line class="edge" x1="204" y1="284" x2="290" y2="284" marker-end="url(#ah)"/>
  <text class="elbl" x="247" y="276" text-anchor="middle">FNV-1a hash</text>
  <text class="elbl" x="247" y="300" text-anchor="middle">% n shards</text>

  <!-- ===== dnsCache: slice of n shards ===== -->
  <text class="lbl mono" x="324" y="128" text-anchor="middle">dnsCache</text>
  <rect class="b-gray" x="292" y="140" width="64" height="36" rx="6"/>
  <text class="note mono" x="324" y="163" text-anchor="middle">0</text>
  <rect class="b-gray" x="292" y="182" width="64" height="36" rx="6"/>
  <text class="note mono" x="324" y="205" text-anchor="middle">1</text>
  <rect class="b-gray" x="292" y="224" width="64" height="36" rx="6"/>
  <text class="lbl" x="324" y="247" text-anchor="middle">…</text>
  <rect class="b-blue" x="292" y="266" width="64" height="36" rx="6"/>
  <text class="lbl mono" x="320" y="289" text-anchor="middle">i</text>
  <rect class="b-gray" x="292" y="308" width="64" height="36" rx="6"/>
  <text class="lbl" x="324" y="331" text-anchor="middle">…</text>
  <rect class="b-gray" x="292" y="350" width="64" height="36" rx="6"/>
  <text class="note mono" x="324" y="373" text-anchor="middle">n−1</text>
  <text class="note" x="324" y="406" text-anchor="middle">n shards</text>
  <text class="note mono" x="324" y="422" text-anchor="middle">[]*dnsCacheUnit</text>

  <!-- shard i -> its dnsCacheUnit -->
  <circle class="dot" cx="342" cy="284" r="3"/>
  <line class="edge" x1="342" y1="284" x2="390" y2="284" marker-end="url(#ah)"/>

  <!-- ===== the shard: one lock + a two-level map ===== -->
  <rect class="b-blue" x="392" y="104" width="368" height="330" rx="12"/>
  <text class="lbl mono" x="408" y="130">dnsCache[i]<tspan class="note" dx="10">points to this dnsCacheUnit</tspan></text>
  <text class="note" x="408" y="148">one RWMutex per shard, guarding its two-level map</text>

  <rect class="b-gray" x="408" y="162" width="336" height="70" rx="8"/>
  <text class="lbl mono" x="424" y="186">lock <tspan class="note mono">sync.RWMutex</tspan></text>
  <text class="note" x="424" y="206">cacheLookup takes RLock: readers share the shard</text>
  <text class="note" x="424" y="222">cacheSet takes Lock: one writer, readers wait</text>

  <text class="lbl mono" x="408" y="258">entries</text>
  <text class="note" x="478" y="258">both levels made lazily by cacheSet</text>
  <text class="note mono" x="408" y="276">map[string]map[RTYPE]*dnsCacheEntry</text>

  <!-- level 1: name -> map -->
  <rect class="b-gray" x="408" y="288" width="164" height="100" rx="8"/>
  <text class="note" x="420" y="307">name (string)</text>
  <line class="b-gray" x1="408" y1="316" x2="572" y2="316"/>
  <rect class="b-orange" x="413" y="321" width="154" height="34" rx="5"/>
  <text class="lbl mono" x="420" y="343">www.example.com</text>
  <line class="b-gray" x1="408" y1="360" x2="572" y2="360"/>
  <text class="note" x="420" y="378">other names …</text>

  <circle class="dot" cx="560" cy="338" r="3"/>
  <line class="edge" x1="560" y1="338" x2="602" y2="338" marker-end="url(#ah)"/>

  <!-- level 2: RTYPE -> *dnsCacheEntry -->
  <rect class="b-gray" x="604" y="288" width="140" height="100" rx="8"/>
  <text class="note" x="616" y="307">t (RTYPE)</text>
  <line class="b-gray" x1="604" y1="316" x2="744" y2="316"/>
  <rect class="b-orange" x="609" y="321" width="130" height="34" rx="5"/>
  <text class="lbl mono" x="616" y="343">RTYPE_A</text>
  <line class="b-gray" x1="604" y1="360" x2="744" y2="360"/>
  <text class="note" x="616" y="378">other types …</text>

  <text class="note mono" x="408" y="414">entries["www.example.com"][RTYPE_A]</text>

  <circle class="dot" cx="730" cy="338" r="3"/>
  <line class="edge" x1="730" y1="338" x2="794" y2="338" marker-end="url(#ah)"/>

  <!-- ===== the entry ===== -->
  <text class="note" x="796" y="266">cacheSet makes a new entry</text>
  <text class="note" x="796" y="282">and replaces the old one</text>

  <rect class="b-green" x="796" y="299" width="168" height="78" rx="10"/>
  <text class="lbl mono" x="810" y="325">dnsCacheEntry</text>
  <text class="note mono" x="810" y="345">expires time.Time</text>
  <text class="note mono" x="810" y="362">data []RDATA</text>

  <text class="note" x="796" y="400">expired → cacheLookup gives nil</text>
  <text class="note" x="796" y="416">and nothing is ever deleted</text>

  <!-- ===== legend + notes ===== -->
  <rect class="b-orange" x="32" y="458" width="14" height="14" rx="3"/>
  <text class="note" x="54" y="469">the example: an A lookup of www.Example.COM.</text>
  <rect class="b-blue" x="356" y="458" width="14" height="14" rx="3"/>
  <text class="note" x="378" y="469">shard i, the one the hash picked</text>
  <circle class="dot" cx="604" cy="465" r="3"/>
  <line class="edge" x1="604" y1="465" x2="636" y2="465" marker-end="url(#ah)"/>
  <text class="note" x="646" y="469">the slot points to the next box (pointer or map)</text>

  <circle class="dot" cx="38" cy="496" r="2.5"/>
  <text class="note" x="50" y="500">Shard count n: 1024 in main.go; the tests use 1, 32 and 1024.</text>
  <circle class="dot" cx="38" cy="518" r="2.5"/>
  <text class="note" x="50" y="522">nameHash also hashes a seed meant to be random per run, but seed is a nil slice: nothing is added, so placement is the same every run.</text>
</svg>
